# NASDAQ Agent — Docker Compose (Phase 1, single EC2 t3.large)
#
# Architecture:
#   web-api    → serves HTTP + WebSocket; reads from Valkey only; no ML
#   scanner    → scan loop + Schwab market data; writes to Valkey + PostgreSQL
#   learner    → off-hours ML training; writes models + DB; market-hours gated
#   scheduler  → EOD position close, Valkey heartbeat; no network dependencies
#
# Communication:
#   scanner → web-api  : Valkey  scan:latest / scan:notify
#   scanner → web-api  : Valkey  md:prices (real-time price fan-out)
#   scanner / learner  : PostgreSQL (shared signal history, trade records)
#
# t3.large resource budget: 2 vCPU / 8 GB RAM
#   market hours  (scanner + web-api + scheduler)  ≈ 6 GB RAM
#   off-hours     (learner + web-api + scheduler)   ≈ 3.5 GB RAM

# Shared settings — referenced via YAML anchors in each service
x-common: &common
  build:
    context: ./nasdaq_agent
    dockerfile: Dockerfile
  image: nasdaq-agent:latest
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - nasdaq-net
  volumes:
    # Persist model files and runtime data across restarts
    - nasdaq-data:/app/data
    - nasdaq-logs:/app/logs
    # Schwab auth tokens must survive restarts; stored at app root by default
    - nasdaq-tokens:/app/tokens

networks:
  nasdaq-net:
    driver: bridge

volumes:
  nasdaq-data:    # model files, SQLite state, backtest cache
  nasdaq-logs:    # structured service logs
  nasdaq-tokens:  # Schwab OAuth token files

services:

  # ── Web API ─────────────────────────────────────────────────────────────────
  # FastAPI + Gunicorn/UvicornWorker.  No heavy ML imports.
  # Reads scan results and prices from Valkey; serves HTTP + WebSocket clients.
  web-api:
    <<: *common
    ports:
      - "8000:8000"
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "0"
    command: ["gunicorn", "-c", "gunicorn.conf.py", "main:app"]
    # HEALTHCHECK is defined in Dockerfile — hits /api/health
    mem_limit: 1500m
    cpus: "0.5"
    pids_limit: 256
    depends_on:
      - scanner   # ensures scan results exist in Valkey before web-api starts

  # ── Scanner + Market Data ───────────────────────────────────────────────────
  # Runs the full scan loop and Schwab streamer/poller.
  # Publishes scan results to Valkey (scan:latest) after every cycle.
  # Publishes price updates to Valkey (md:prices) every ~300 ms via streamer.
  scanner:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "1"
      NASDAQ_MARKET_DATA_ENABLED:  "1"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "0"
    command: ["python", "-m", "services.scanner_service"]
    # Override HEALTHCHECK — scanner has no HTTP; considered healthy if running
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import redis, os; r=redis.Redis(host=os.getenv('VALKEY_HOST','localhost')); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    mem_limit: 5000m
    cpus: "1.5"
    pids_limit: 512

  # ── Learner ─────────────────────────────────────────────────────────────────
  # Off-hours ML training.  Internal market-hours gate blocks all training
  # activity during regular and extended trading hours.
  learner:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "1"
      NASDAQ_SCHEDULER_ENABLED:    "0"
    command: ["python", "-m", "services.learner_service"]
    healthcheck:
      test: ["CMD", "python3", "-c", "print('ok')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2500m
    cpus: "0.5"
    pids_limit: 256

  # ── Scheduler ───────────────────────────────────────────────────────────────
  # Lightweight process: EOD force-close watchdog + Valkey heartbeat.
  # Must stay up continuously — restarts instantly if it crashes.
  scheduler:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "1"
    command: ["python", "-m", "services.scheduler_service"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import redis, os, json, time; r=redis.Redis(host=os.getenv('VALKEY_HOST','localhost')); \
              v=r.get('scheduler:heartbeat'); \
              assert v and time.time()-json.loads(v)['ts']<120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: "0.1"
    pids_limit: 64
