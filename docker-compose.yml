# NASDAQ Agent — Docker Compose (Phase 1, single EC2 t3.large)
#
# Architecture:
#   web-api      → serves HTTP + WebSocket; reads from Valkey only; no ML
#   market-data  → Schwab WebSocket streamer + REST poller; publishes md:prices
#                  and md:1m:{ticker} candle lists to Valkey
#   scanner      → scan loop only; reads candles from Valkey (no local streamer)
#   learner      → off-hours ML training; writes models + DB; market-hours gated
#   scheduler    → EOD position close, Valkey heartbeat; no network dependencies
#
# Communication:
#   market-data → scanner   : Valkey  md:1m:{ticker} (1-min candles, LIST)
#   market-data → web-api   : Valkey  md:prices (real-time price fan-out)
#   market-data → web-api   : Valkey  scanner:streamer (streamer status, 15s)
#   scanner     → web-api   : Valkey  scan:latest / scan:notify
#   scanner / learner       : PostgreSQL (shared signal history, trade records)
#
# t3.large resource budget: 2 vCPU / 8 GB RAM
#   market hours  (market-data + scanner + web-api + scheduler)  ≈ 6.3 GB RAM
#   off-hours     (learner + web-api + scheduler)                 ≈ 3.5 GB RAM
#
# Logging:
#   All containers write to /app/logs (bind-mounted → /opt/nasdaq-agent/logs).
#   Docker's own stdout capture is capped at 10 MB × 3 files per container
#   to prevent /var/lib/docker from filling the disk.

# ── Shared Docker log driver ─────────────────────────────────────────────────
# Applied to every service via the anchor below.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# ── Shared service settings ──────────────────────────────────────────────────
x-common: &common
  build:
    context: ./nasdaq_agent
    dockerfile: Dockerfile
  image: nasdaq-agent:latest
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - nasdaq-net
  logging: *logging
  volumes:
    # Persist model files and runtime data on the host.
    # Bind-mount means the host directory IS the container path — no docker cp needed.
    # Ensure the directory exists before first run: mkdir -p /opt/nasdaq-agent/nasdaq_agent/data
    - /opt/nasdaq-agent/nasdaq_agent/data:/app/data
    # Persist Schwab OAuth tokens outside the code/data tree.
    # Ensure the directory exists before first run: mkdir -p /opt/nasdaq-agent/tokens
    - /opt/nasdaq-agent/tokens:/app/tokens
    # Bind-mount host log directory so all service logs appear in one place
    # on the host at /opt/nasdaq-agent/logs
    - /opt/nasdaq-agent/logs:/app/logs

networks:
  nasdaq-net:
    driver: bridge

volumes: {}  # all data bind-mounted to host; no named volumes needed

services:

  # ── Web API ─────────────────────────────────────────────────────────────────
  # FastAPI + Gunicorn/UvicornWorker.  No heavy ML imports.
  # Reads scan results and prices from Valkey; serves HTTP + WebSocket clients.
  web-api:
    <<: *common
    ports:
      - "8000:8000"
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "0"
      SCHWAB_TOKEN_DIR:            "/app/tokens"
      LOG_DIR:                     "/app/logs"
    command: ["gunicorn", "-c", "gunicorn.conf.py", "main:app"]
    # HEALTHCHECK is defined in Dockerfile — hits /api/health
    mem_limit: 1000m
    cpus: "0.5"
    pids_limit: 256
    depends_on:
      - scanner      # ensures scan results exist in Valkey before web-api starts
      - market-data  # ensures md:prices is populated before web-api serves price data

  # ── Market Data ─────────────────────────────────────────────────────────────
  # Dedicated Schwab WebSocket streamer + REST MD poller.
  # Publishes:  md:prices  (Redis HASH + pub/sub, ~300 ms cadence)
  #             md:1m:{ticker}  (Redis LIST, one entry per closed 1-min candle)
  #             scanner:streamer  (status key, 15s cadence)
  # The scanner reads candles from md:1m:{ticker} via data_fetcher Tier A½.
  market-data:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "1"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "0"
      SCHWAB_TOKEN_DIR:            "/app/tokens"
      LOG_DIR:                     "/app/logs"
      NASDAQ_WS_STANDDOWN_FRESH_PCT: "0.95"
      MD_HEALTH_MAX_PRICE_AGE_S:   "5"
      MD_HEALTH_MIN_FRESH_PCT:     "90"
    command: ["python", "-m", "services.market_data_service"]
    healthcheck:
      # Three-tier check:
      #   1. Valkey ping (always)
      #   2. scanner:streamer age < 90 s (status-publisher loop alive)
      #   3. md:prices freshness < 90 s (active sessions only — quotes flowing)
      test: ["CMD", "python3", "/app/services/md_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 800m
    cpus: "0.5"
    pids_limit: 128

  # ── Scanner ──────────────────────────────────────────────────────────────────
  # Runs the scan loop only — no Schwab streamer (NASDAQ_MARKET_DATA_ENABLED=0).
  # Reads 1-min candles from Valkey (md:1m:{ticker}) published by market-data.
  # Publishes scan results to Valkey (scan:latest) after every cycle.
  scanner:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "1"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "0"
      NASDAQ_SCANNER_TRAINING_ENABLED: "0"
      ADAPTIVE_FILTER_ENFORCEMENT_MODE: "observe"
      SCHWAB_TOKEN_DIR:            "/app/tokens"
      LOG_DIR:                     "/app/logs"
    command: ["python", "-m", "services.scanner_service"]
    depends_on:
      - market-data           # ensure market-data is up before scanner starts
    healthcheck:
      #   1. Valkey ping                 (always)
      #   2. scan:latest exists in PG/Valkey (proves first cycle completed)
      #   3. scan:latest age < threshold (active sessions only; 180 s REGULAR, 300 s extended)
      test: ["CMD", "python3", "/app/services/scanner_healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    mem_limit: 3500m
    cpus: "1.3"
    pids_limit: 512

  # ── Learner ─────────────────────────────────────────────────────────────────
  # Off-hours ML training.  Internal market-hours gate blocks all training
  # activity during regular and extended trading hours.
  learner:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "1"
      NASDAQ_SCHEDULER_ENABLED:    "0"
      LEARNING_RETRAIN_ACTIVE_SESSIONS: "1"
      LEARNING_RETRAIN_INCLUDE_DEEP: "1"
      LEARNER_DEEP_ENABLED:        "1"
      LEARNER_DEEP_INTERVAL_S:     "3600"
      LEARNER_DEEP_TICKER_LIMIT:   "100"
      ADAPTIVE_FILTER_ENFORCEMENT_MODE: "observe"
      LOG_DIR:                     "/app/logs"
    command: ["python", "-m", "services.learner_service"]
    healthcheck:
      test: ["CMD", "python3", "/app/services/learner_healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    mem_limit: 1500m
    cpus: "0.5"
    pids_limit: 256

  # ── Context Intelligence ────────────────────────────────────────────────────
  # Polls Finnhub (news + earnings) and publishes rolling context features to
  # Valkey (ctx:latest:{ticker}, TTL 600 s) and PostgreSQL.
  # Scanner reads from Valkey; this container has zero impact on scan latency.
  # Provider outage (Finnhub down / missing FINNHUB_API_KEY) is non-fatal;
  # the scanner continues with last-known features or safe defaults.
  context-intel:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:       "0"
      NASDAQ_MARKET_DATA_ENABLED:   "0"
      NASDAQ_LEARNER_ENABLED:       "0"
      NASDAQ_SCHEDULER_ENABLED:     "0"
      NASDAQ_CONTEXT_INTEL_ENABLED: "1"
      LOG_DIR:                      "/app/logs"
    command: ["python", "-m", "services.context_intel_service"]
    depends_on:
      - market-data
    healthcheck:
      # Process alive + DB reachable + Valkey reachable + feature-compute heartbeat.
      # Provider (Finnhub) reachability is NOT checked — a Finnhub outage must
      # not restart this container; report it via /api/services/status instead.
      test: ["CMD", "python3", "/app/services/context_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 512m
    cpus: "0.3"
    pids_limit: 128

  # ── Scheduler ───────────────────────────────────────────────────────────────
  # Lightweight process: EOD force-close watchdog + Valkey heartbeat.
  # Must stay up continuously — restarts instantly if it crashes.
  scheduler:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "1"
      LOG_DIR:                     "/app/logs"
    command: ["python", "-m", "services.scheduler_service"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import sys,json,time; sys.path.insert(0,'/app'); from agent.valkey_client import _get_client; c=_get_client(); v=c.get('scheduler:heartbeat'); assert v and time.time()-json.loads(v)['ts']<120"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: "0.1"
    pids_limit: 64

  # Lightweight self-healing loop. Docker restart policies restart crashed
  # processes; this restarts containers that become unhealthy or remain stopped.
  watchdog:
    <<: *common
    environment:
      NASDAQ_SCANNER_ENABLED:      "0"
      NASDAQ_MARKET_DATA_ENABLED:  "0"
      NASDAQ_LEARNER_ENABLED:      "0"
      NASDAQ_SCHEDULER_ENABLED:    "0"
      LOG_DIR:                     "/app/logs"
      WATCHDOG_INTERVAL_S:         "30"
      WATCHDOG_UNHEALTHY_STRIKES:  "2"
      WATCHDOG_SERVICES:           "web-api,market-data,scanner,learner,scheduler,context-intel"
    command: ["python", "-m", "services.watchdog_service"]
    volumes:
      - /opt/nasdaq-agent/nasdaq_agent/data:/app/data
      - /opt/nasdaq-agent/tokens:/app/tokens
      - /opt/nasdaq-agent/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    mem_limit: 128m
    cpus: "0.05"
    pids_limit: 64
