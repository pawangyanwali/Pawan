name: Deploy to AWS EC2

on:
  push:
    branches:
      - claude/nasdaq-stock-prediction-agent-kDe60
    paths:
      - 'nasdaq_agent/**'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    name: Fast test suite (< 60s)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nasdaq_agent/requirements.txt

      - name: Install test dependencies
        working-directory: nasdaq_agent
        run: |
          pip install --quiet \
            fastapi uvicorn gunicorn websockets \
            pandas numpy scikit-learn joblib xgboost ta \
            textblob aiohttp requests python-multipart \
            python-dotenv pytz cryptography redis \
            psycopg2-binary asyncpg \
            PyJWT bcrypt email-validator pyotp qrcode alembic \
            pytest pytest-asyncio pytest-timeout httpx
          # CPU-only torch (saves ~1.8 GB vs CUDA build)
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run fast suite
        working-directory: nasdaq_agent
        env:
          NASDAQ_SCANNER_ENABLED: "0"
          NASDAQ_MARKET_DATA_ENABLED: "0"
          NASDAQ_LEARNER_ENABLED: "0"
          NASDAQ_SCHEDULER_ENABLED: "0"
        run: |
          pytest tests/test_fast_suite.py \
                 tests/test_market_hours.py \
                 tests/test_vwap.py \
                 tests/test_risk_controls.py \
                 tests/test_paper_trading.py \
                 tests/test_live_backtest.py \
                 tests/test_signal_cache.py \
                 tests/test_backtest.py \
                 tests/test_exit_signals.py \
                 tests/test_opening_range.py \
                 tests/test_macro_calendar.py \
                 tests/test_scalp_entry_quality.py \
                 tests/test_scalp_execution_policy.py \
                 tests/test_scalp_learning.py \
                 tests/test_release5_scalp_runtime.py \
                 tests/test_scalp_candidate_tracker.py \
                 tests/test_schwab_streamer_subscriptions.py \
                 tests/test_scalp_command_center.py \
                 tests/test_health_page_static.py \
                 --timeout=8 -x -q 2>&1 | tail -30

  deploy:
    name: SSH deploy & reload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.DEPLOY_HOST }}
          username:        ${{ secrets.DEPLOY_USER }}
          key:             ${{ secrets.DEPLOY_SSH_KEY }}
          port:            22
          command_timeout: 15m
          script: |
            set -e
            APP_DIR="/opt/nasdaq-agent"
            APP_USER="nasdaq"

            # ── Fix repo ownership for git ────────────────────────────────────
            # Earlier sudo ops can leave files owned by root; git 2.35.2+ refuses
            # to run in repos with mixed ownership ('dubious ownership' error).
            # Scope: only the git repo files, NOT the EBS bind-mount dirs whose
            # ownership must be UID 1000 for the container user.
            sudo chown -R "$APP_USER":"$APP_USER" "$APP_DIR"

            # Register as safe so git never refuses regardless of future chown ops.
            sudo -u "$APP_USER" git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            echo "=== Pulling latest code ==="
            sudo -u "$APP_USER" git -C "$APP_DIR" fetch origin
            sudo -u "$APP_USER" git -C "$APP_DIR" reset --hard origin/claude/nasdaq-stock-prediction-agent-kDe60
            EXPECTED_SHA="${{ github.sha }}"
            DEPLOYED_SHA=$(sudo -u "$APP_USER" git -C "$APP_DIR" rev-parse HEAD)
            if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: checked-out commit $DEPLOYED_SHA does not match workflow commit $EXPECTED_SHA"
              exit 1
            fi

            # ── Docker Compose path ────────────────────────────────────────────
            if command -v docker &>/dev/null && sudo -u "$APP_USER" docker info &>/dev/null; then
              echo "=== Docker detected — building and restarting services ==="

              # Ensure .env exists (operator must place this on the server; never committed)
              if [ ! -f "$APP_DIR/.env" ]; then
                echo "ERROR: $APP_DIR/.env not found — create it from nasdaq_agent/.env.example"
                exit 1
              fi

              # ── EBS bind-mount directories ────────────────────────────────────
              # Create dirs as root (they may not exist on first deploy).
              # Ownership MUST be UID 1000 — that is the container user (nasdaq,
              # created with useradd -u 1000 in the Dockerfile).
              # This chown runs AFTER the repo chown above so it is never overwritten.
              sudo mkdir -p "$APP_DIR/models" "$APP_DIR/tokens" "$APP_DIR/tokens/backup" \
                            "$APP_DIR/cache"  "$APP_DIR/logs"
              sudo chown -R 1000:1000 "$APP_DIR/models" "$APP_DIR/tokens" \
                                      "$APP_DIR/cache"  "$APP_DIR/logs"

              # ── Build the Docker image ────────────────────────────────────────
              # Use 'docker build' directly so the build context is unambiguous:
              # $APP_DIR/nasdaq_agent/ contains both the Dockerfile and all app code.
              # 'docker compose build' with --project-directory resolves context: .
              # relative to the project dir (not the compose file), which would look
              # for the Dockerfile one level up and fail.
              echo "=== Building image ==="
              IMAGE_TAG="${IMAGE_TAG:-latest}"
              sudo -u "$APP_USER" docker build \
                -t "nasdaq-agent:${IMAGE_TAG}" \
                "$APP_DIR/nasdaq_agent"

              # Shorthand: docker compose with explicit compose file path.
              _dc() { sudo -u "$APP_USER" docker compose \
                        -f "$APP_DIR/nasdaq_agent/docker-compose.yml" \
                        --project-directory "$APP_DIR" "$@"; }

              # ── Helper: docker compose ps JSON → Health field ─────────────────
              # Compose v2 may return a JSON array OR a single object depending on
              # the version. This one-liner handles both forms safely.
              _svc_health() {
                local svc="$1"
                _dc ps --format json "$svc" 2>/dev/null \
                  | python3 -c "import sys,json; raw=sys.stdin.read().strip(); d=json.loads(raw) if raw else {}; o=d[0] if isinstance(d,list) else d; print(o.get('Health',o.get('health',o.get('State','unknown'))))" \
                  2>/dev/null || echo "unknown"
              }

              # Rolling update: bring up new containers; remove old ones when healthy
              _dc up -d --remove-orphans

              # Every recreated critical container must remain at restart count zero.
              # A short-lived healthy window must not hide an OOM/restart loop.
              CRITICAL_CONTAINERS="nasdaq-web-api nasdaq-token-service nasdaq-scalp-engine nasdaq-market-data nasdaq-scalp-learner nasdaq-scheduler nasdaq-context-intel nasdaq-watchdog"

              if sudo docker ps -a --format '{{.Names}}' | grep -Eq '^nasdaq-(scanner|learner)$'; then
                echo "ERROR: orphaned legacy runtime container still exists"
                sudo docker ps -a --filter name=nasdaq-scanner --filter name=nasdaq-learner
                exit 1
              fi

              # ── Wait for token-service (fatal; owns all refresh timers) ──────────
              echo "=== Waiting for token-service to become healthy (max 1 min) ==="
              TOKEN_SVC_HEALTHY=0
              for i in $(seq 1 6); do
                sleep 10
                status=$(_svc_health token-service)
                if [ "$status" = "healthy" ]; then
                  echo "  token-service healthy after $((i*10))s"
                  TOKEN_SVC_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/6: health=$status"
              done

              if [ "$TOKEN_SVC_HEALTHY" = "0" ]; then
                echo "ERROR: token-service did not become healthy within 1 min — printing logs"
                _dc logs --tail 40 token-service 2>/dev/null || true
                exit 1
              fi

              # ── Wait for web-api (fatal if not healthy) ────────────────────────
              echo "=== Waiting for web-api to become healthy (max 3 min) ==="
              WEB_API_HEALTHY=0
              for i in $(seq 1 18); do
                sleep 10
                status=$(_svc_health web-api)
                if [ "$status" = "healthy" ]; then
                  echo "  web-api healthy after $((i*10))s"
                  WEB_API_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/18: health=$status"
              done

              if [ "$WEB_API_HEALTHY" = "0" ]; then
                echo "ERROR: web-api did not become healthy within 3 min — printing logs"
                _dc logs --tail 60 web-api 2>/dev/null \
                  || sudo docker logs --tail 60 nasdaq-web-api 2>/dev/null \
                  || echo "(could not retrieve logs)"
                exit 1
              fi

              # ── Wait for market-data (fatal; feeds prices to scanner) ─────────
              echo "=== Waiting for market-data to become healthy (max 2 min) ==="
              MARKET_DATA_HEALTHY=0
              for i in $(seq 1 12); do
                sleep 10
                status=$(_svc_health market-data)
                if [ "$status" = "healthy" ]; then
                  echo "  market-data healthy after $((i*10))s"
                  MARKET_DATA_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/12: health=$status"
              done

              if [ "$MARKET_DATA_HEALTHY" = "0" ]; then
                echo "ERROR: market-data did not become healthy within 2 min — printing logs"
                _dc logs --tail 60 market-data 2>/dev/null || true
                exit 1
              fi

              # ── Wait for scanner (fatal; first scan cycle can take 90s) ────────
              echo "=== Waiting for scalp-engine to become healthy (max 2 min) ==="
              SCALP_ENGINE_HEALTHY=0
              for i in $(seq 1 12); do
                sleep 10
                status=$(_svc_health scalp-engine)
                if [ "$status" = "healthy" ]; then
                  echo "  scalp-engine healthy after $((i*10))s"
                  SCALP_ENGINE_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/12: health=$status"
              done

              if [ "$SCALP_ENGINE_HEALTHY" = "0" ]; then
                echo "ERROR: scalp-engine did not become healthy within 2 min"
                _dc logs --tail 60 scalp-engine 2>/dev/null || true
                exit 1
              fi

              # ── Wait for scheduler (non-fatal; just needs Valkey) ─────────────
              echo "=== Waiting for scheduler to become healthy (max 2 min) ==="
              for i in $(seq 1 12); do
                sleep 10
                status=$(_svc_health scheduler)
                if [ "$status" = "healthy" ]; then
                  echo "  scheduler healthy after $((i*10))s"
                  break
                fi
                echo "  Attempt $i/12: health=$status"
                if [ $i -eq 12 ]; then
                  echo "WARNING: scheduler not yet healthy after 2 min"
                  _dc logs --tail 30 scheduler 2>/dev/null || true
                fi
              done

              # ── Wait for learner (non-fatal; 5 min startup delay by design) ───
              echo "=== Waiting for scalp-learner to become healthy (max 2 min) ==="
              SCALP_LEARNER_HEALTHY=0
              for i in $(seq 1 12); do
                sleep 10
                status=$(_svc_health scalp-learner)
                if [ "$status" = "healthy" ]; then
                  echo "  scalp-learner healthy after $((i*10))s"
                  SCALP_LEARNER_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/12: health=$status"
                if [ $i -eq 12 ]; then
                  echo "ERROR: scalp-learner not healthy after 2 min"
                  _dc logs --tail 30 scalp-learner 2>/dev/null || true
                fi
              done
              if [ "$SCALP_LEARNER_HEALTHY" = "0" ]; then
                exit 1
              fi

              # ── Wait for context-intel (non-fatal; 120s start_period) ─────────
              echo "=== Waiting for context-intel to become healthy (max 3 min) ==="
              CONTEXT_HEALTHY=0
              for i in $(seq 1 18); do
                sleep 10
                status=$(_svc_health context-intel)
                if [ "$status" = "healthy" ]; then
                  echo "  context-intel healthy after $((i*10))s"
                  CONTEXT_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/18: health=$status"
                if [ $i -eq 18 ]; then
                  echo "WARNING: context-intel not yet healthy after 3 min — check logs"
                  _dc logs --tail 30 context-intel 2>/dev/null || true
                fi
              done
              if [ "$CONTEXT_HEALTHY" = "0" ]; then
                exit 1
              fi

              echo "=== Activating health-gated scalp-only shadow validation ==="
              _dc exec -T scalp-engine python -m scripts.activate_scalp_only

              echo "=== Functional production readiness gate (max 2 min) ==="
              PRODUCTION_READY=0
              for i in $(seq 1 12); do
                if _dc exec -T scalp-engine python -m scripts.validate_production_release; then
                  PRODUCTION_READY=1
                  echo "  Functional readiness passed after $((i*10))s"
                  break
                fi
                echo "  Attempt $i/12 failed; waiting for subscriptions, bars, and first full cycle"
                sleep 10
              done
              if [ "$PRODUCTION_READY" = "0" ]; then
                echo "ERROR: functional production readiness gate failed"
                _dc logs --tail 80 market-data scalp-engine 2>/dev/null || true
                exit 1
              fi

              echo "=== Stability soak and restart/OOM gate (75s) ==="
              sleep 75
              if ! _dc exec -T scalp-engine python -m scripts.validate_production_release; then
                echo "ERROR: functional readiness failed after stability soak"
                exit 1
              fi
              STABILITY_FAILED=0
              for container in $CRITICAL_CONTAINERS; do
                restart_count=$(sudo docker inspect "$container" --format '{{.RestartCount}}' 2>/dev/null || echo missing)
                oom_killed=$(sudo docker inspect "$container" --format '{{.State.OOMKilled}}' 2>/dev/null || echo unknown)
                running=$(sudo docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || echo false)
                echo "  $container: running=$running restarts=$restart_count oom=$oom_killed"
                if [ "$running" != "true" ] || [ "$restart_count" != "0" ] || [ "$oom_killed" != "false" ]; then
                  STABILITY_FAILED=1
                fi
              done
              if [ "$STABILITY_FAILED" = "1" ]; then
                echo "ERROR: one or more critical containers restarted, OOMed, or stopped"
                _dc ps
                _dc logs --tail 80 market-data scalp-engine token-service 2>/dev/null || true
                exit 1
              fi

              # ── Wait for watchdog (non-fatal; quick 15s start_period) ─────────
              echo "=== Waiting for watchdog to become healthy (max 1 min) ==="
              for i in $(seq 1 6); do
                sleep 10
                status=$(_svc_health watchdog)
                if [ "$status" = "healthy" ]; then
                  echo "  watchdog healthy after $((i*10))s"
                  break
                fi
                echo "  Attempt $i/6: health=$status"
                if [ $i -eq 6 ]; then
                  echo "WARNING: watchdog not yet healthy after 1 min — check logs"
                  _dc logs --tail 30 watchdog 2>/dev/null || true
                fi
              done

              # ── HTTP health endpoint ───────────────────────────────────────────
              echo "=== HTTP health check ==="
              for i in 1 2 3; do
                if curl -sf --max-time 10 http://localhost:8000/api/health \
                     | python3 -c "import sys,json; d=json.load(sys.stdin); \
                       print('status:', d.get('status','?'), '| tickers:', d.get('tickers','?'))"; then
                  break
                fi
                echo "  Health check attempt $i/3 failed, retrying..."
                sleep 5
              done

              # ── Services summary from /api/services ───────────────────────────
              echo "=== Service health summary ==="
              curl -sf --max-time 10 http://localhost:8000/api/services 2>/dev/null \
                | python3 -c "import sys,json; d=json.load(sys.stdin); [print('  '+s+': '+('UP' if i.get('up') else 'STALE')+(' ('+str(round(i['last_seen_ago_s']))+'s)' if i.get('last_seen_ago_s') else '')) for s,i in d.get('containers',{}).items()]; pa=(d.get('market_data') or {}).get('price_age_s'); pa and print('  md:prices: '+str(round(pa))+'s ago')" \
                2>/dev/null || echo "  (api/services not reachable)"

              echo "=== Service status (Docker) ==="
              _dc ps

              # ── Full diagnostics for any unhealthy container ───────────────────
              # Dumps last 60 log lines per unhealthy service so failures are fully
              # visible in the Actions log without needing to SSH in.
              UNHEALTHY=0
              for svc in web-api token-service scalp-engine market-data scalp-learner scheduler context-intel watchdog; do
                status=$(_svc_health "$svc")
                if [ "$status" != "healthy" ]; then
                  UNHEALTHY=1
                  echo ""
                  echo "##############################################"
                  echo "# UNHEALTHY: $svc (status=$status)"
                  echo "##############################################"
                  _dc logs --tail 60 "$svc" 2>/dev/null || true
                fi
              done
              if [ "$UNHEALTHY" = "1" ]; then
                echo ""
                echo "WARNING: one or more services are unhealthy — see logs above"
              fi

              echo "=== Deployed via Docker Compose successfully ==="

            else
              echo "ERROR: Docker Compose is required for the scalp-only runtime"
              exit 1
            fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED — check GitHub Actions logs"
          echo ""
          echo "Common causes of 'i/o timeout' on port 22:"
          echo "  1. AWS EC2 security group: ensure port 22 is open for GitHub Actions IPs"
          echo "     Reference: https://api.github.com/meta (look for 'actions' IP ranges)"
          echo "  2. DEPLOY_HOST secret contains wrong IP address"
          echo "  3. Instance is stopped/rebooted and has a new IP"
