name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - claude/nasdaq-stock-prediction-agent-kDe60
    paths:
      - 'nasdaq_agent/**'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    name: Run tests (shard ${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'nasdaq_agent/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r nasdaq_agent/requirements.txt

      - name: Run tests (shard ${{ matrix.group }}/4)
        working-directory: nasdaq_agent
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-for-ci-only
        run: |
          python -m pytest tests/ \
            --splits 4 --group ${{ matrix.group }} \
            --durations-path .test_durations \
            --store-durations \
            -n auto \
            --tb=short -q

  deploy:
    name: SSH deploy & reload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.DEPLOY_HOST }}
          username:        ${{ secrets.DEPLOY_USER }}
          key:             ${{ secrets.DEPLOY_SSH_KEY }}
          port:            22
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="/opt/nasdaq-agent"
            VENV="$APP_DIR/venv"
            SERVICE="nasdaq-agent"
            APP_USER="nasdaq"

            echo "=== Pulling latest code ==="
            sudo -u "$APP_USER" git -C "$APP_DIR" fetch origin
            sudo -u "$APP_USER" git -C "$APP_DIR" reset --hard origin/claude/nasdaq-stock-prediction-agent-kDe60

            echo "=== Installing any new dependencies ==="
            sudo -u "$APP_USER" "$VENV/bin/pip" install -q -r "$APP_DIR/nasdaq_agent/requirements.txt"

            echo "=== Ensure service file has required directives ==="
            SERVICE_FILE="/etc/systemd/system/${SERVICE}.service"
            PATCHED=0
            if ! grep -q "ExecStartPre" "$SERVICE_FILE"; then
              sudo sed -i '/^ExecStart=/i ExecStartPre=/bin/truncate -s 0 /opt/nasdaq-agent/logs/agent.err' "$SERVICE_FILE"
              echo "Patched service file with ExecStartPre"
              PATCHED=1
            fi
            if ! grep -q "ExecReload" "$SERVICE_FILE"; then
              sudo sed -i '/^ExecStart=/a ExecReload=/bin/kill -s HUP $MAINPID' "$SERVICE_FILE"
              echo "Patched service file with ExecReload"
              PATCHED=1
            fi
            if [ "$PATCHED" = "1" ]; then
              sudo systemctl daemon-reload
            fi

            echo "=== Reloading service (zero-downtime) ==="
            if sudo systemctl reload "$SERVICE" 2>/dev/null; then
              echo "Graceful reload sent"
            else
              echo "Reload not supported, falling back to restart"
              sudo systemctl restart "$SERVICE"
            fi

            echo "=== Waiting for service to come up ==="
            for i in $(seq 1 12); do
              sleep 5
              status=$(systemctl is-active "$SERVICE" 2>/dev/null || echo "unknown")
              if [ "$status" = "active" ]; then
                echo "Service is active after $((i*5))s"
                break
              fi
              echo "  Attempt $i/12: status=$status"
              if [ $i -eq 12 ]; then
                echo "ERROR: Service failed to start within 60s"
                sudo journalctl -u "$SERVICE" --no-pager -n 50
                exit 1
              fi
            done

            echo "=== Health check (internal) ==="
            # localhost:8000 is correct here — this runs INSIDE the SSH session on the server
            for i in 1 2 3; do
              if curl -sf --max-time 10 http://localhost:8000/api/health \
                   | python3 -c "import sys,json; d=json.load(sys.stdin); \
                     print('Health:', d.get('status','?'), '| Tickers:', d.get('tickers','?'))"; then
                break
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 5
            done

            echo "=== Deployed successfully ==="

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED — check GitHub Actions logs"
          echo ""
          echo "Common causes of 'i/o timeout' on port 22:"
          echo "  1. AWS Lightsail firewall: add port 22 inbound rule for GitHub Actions IPs"
          echo "     Reference: https://api.github.com/meta (look for 'actions' IP ranges)"
          echo "  2. DEPLOY_HOST secret contains wrong IP address"
          echo "  3. Server is stopped/rebooted and has a new IP"
