name: Deploy to AWS EC2

on:
  push:
    branches:
      - claude/nasdaq-stock-prediction-agent-kDe60
    paths:
      - 'nasdaq_agent/**'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    name: Fast test suite (< 60s)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nasdaq_agent/requirements.txt

      - name: Install test dependencies
        working-directory: nasdaq_agent
        run: |
          pip install --quiet \
            fastapi uvicorn gunicorn websockets \
            pandas numpy scikit-learn joblib xgboost ta \
            textblob aiohttp requests python-multipart \
            python-dotenv pytz cryptography redis \
            psycopg2-binary asyncpg \
            PyJWT bcrypt email-validator pyotp qrcode alembic \
            pytest pytest-asyncio pytest-timeout httpx
          # CPU-only torch (saves ~1.8 GB vs CUDA build)
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run fast suite
        working-directory: nasdaq_agent
        env:
          NASDAQ_SCANNER_ENABLED: "0"
          NASDAQ_MARKET_DATA_ENABLED: "0"
          NASDAQ_LEARNER_ENABLED: "0"
          NASDAQ_SCHEDULER_ENABLED: "0"
        run: |
          pytest tests/test_fast_suite.py \
                 tests/test_market_hours.py \
                 tests/test_vwap.py \
                 tests/test_risk_controls.py \
                 tests/test_paper_trading.py \
                 tests/test_live_backtest.py \
                 tests/test_signal_cache.py \
                 tests/test_backtest.py \
                 tests/test_exit_signals.py \
                 tests/test_opening_range.py \
                 tests/test_macro_calendar.py \
                 --timeout=8 -x -q 2>&1 | tail -30

  deploy:
    name: SSH deploy & reload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:            ${{ secrets.DEPLOY_HOST }}
          username:        ${{ secrets.DEPLOY_USER }}
          key:             ${{ secrets.DEPLOY_SSH_KEY }}
          port:            22
          command_timeout: 15m
          script: |
            set -e
            APP_DIR="/opt/nasdaq-agent"
            APP_USER="nasdaq"

            # ── Fix ownership before any git or docker operation ───────────────
            # Earlier sudo operations (mkdir, chown) can leave files owned by root
            # inside APP_DIR.  Git 2.35.2+ refuses to run in repos with mixed
            # ownership ('dubious ownership' error).  Docker also needs its config
            # directory (~/.docker/config.json) to be owned by the running user.
            sudo chown -R "$APP_USER":"$APP_USER" "$APP_DIR"

            # Register the directory as safe for the nasdaq user so git never
            # refuses to operate here regardless of how ownership evolves.
            sudo -u "$APP_USER" git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            echo "=== Pulling latest code ==="
            sudo -u "$APP_USER" git -C "$APP_DIR" fetch origin
            sudo -u "$APP_USER" git -C "$APP_DIR" reset --hard origin/claude/nasdaq-stock-prediction-agent-kDe60

            # ── Docker Compose path ────────────────────────────────────────────
            # Used when Docker is installed on the EC2 instance.
            # Activate by running: sudo apt-get install -y docker.io docker-compose-plugin
            # then: sudo usermod -aG docker $APP_USER
            if command -v docker &>/dev/null && sudo -u "$APP_USER" docker info &>/dev/null; then
              echo "=== Docker detected — building and restarting services ==="
              cd "$APP_DIR"

              # Ensure .env exists (operator must place this on the server; never committed)
              if [ ! -f "$APP_DIR/.env" ]; then
                echo "ERROR: $APP_DIR/.env not found — create it from nasdaq_agent/.env.example"
                exit 1
              fi

              # Ensure EBS bind-mount directories exist and are owned by container UID 1000.
              # Run as root (sudo) because they may not exist yet on first deploy.
              sudo mkdir -p "$APP_DIR/models" "$APP_DIR/tokens" "$APP_DIR/tokens/backup" \
                            "$APP_DIR/cache"  "$APP_DIR/logs"
              sudo chown -R 1000:1000 "$APP_DIR/models" "$APP_DIR/tokens" \
                                      "$APP_DIR/cache"  "$APP_DIR/logs"
              # Restore nasdaq ownership so docker and git keep working.
              sudo chown -R "$APP_USER":"$APP_USER" "$APP_DIR"

              # Shorthand: docker compose with explicit compose file path.
              # docker-compose.yml lives under nasdaq_agent/, not the repo root.
              _dc() { sudo -u "$APP_USER" docker compose \
                        -f "$APP_DIR/nasdaq_agent/docker-compose.yml" \
                        --project-directory "$APP_DIR" "$@"; }

              # ── Helper: docker compose ps JSON → Health field ─────────────────
              # Compose v2 may return a JSON array OR a single object depending on
              # the version. This one-liner handles both forms safely.
              _svc_health() {
                local svc="$1"
                _dc ps --format json "$svc" 2>/dev/null \
                  | python3 -c "
import sys, json
raw = sys.stdin.read().strip()
if not raw: print('unknown'); raise SystemExit(0)
d = json.loads(raw)
if isinstance(d, list): d = d[0] if d else {}
print(d.get('Health', d.get('health', d.get('State', 'unknown'))))
" 2>/dev/null || echo "unknown"
              }

              # Build the new image (uses layer cache; only rebuilds changed layers)
              _dc build --pull

              # Rolling update: bring up new containers; remove old ones when healthy
              _dc up -d --remove-orphans

              # ── Wait for web-api (fatal if not healthy) ────────────────────────
              echo "=== Waiting for web-api to become healthy (max 3 min) ==="
              WEB_API_HEALTHY=0
              for i in $(seq 1 18); do
                sleep 10
                status=$(_svc_health web-api)
                if [ "$status" = "healthy" ]; then
                  echo "  web-api healthy after $((i*10))s"
                  WEB_API_HEALTHY=1
                  break
                fi
                echo "  Attempt $i/18: health=$status"
              done

              if [ "$WEB_API_HEALTHY" = "0" ]; then
                echo "ERROR: web-api did not become healthy within 3 min — printing logs"
                _dc logs --tail 60 web-api 2>/dev/null \
                  || sudo docker logs --tail 60 nasdaq-web-api 2>/dev/null \
                  || echo "(could not retrieve logs)"
                exit 1
              fi

              # ── Wait for market-data (non-fatal warning) ───────────────────────
              echo "=== Waiting for market-data to become healthy (max 90s) ==="
              for i in $(seq 1 9); do
                sleep 10
                status=$(_svc_health market-data)
                if [ "$status" = "healthy" ]; then
                  echo "  market-data healthy after $((i*10))s"
                  break
                fi
                echo "  Attempt $i/9: health=$status"
                if [ $i -eq 9 ]; then
                  echo "WARNING: market-data not yet healthy after 90s — check logs"
                  _dc logs --tail 30 market-data 2>/dev/null || true
                fi
              done

              # ── Wait for scanner (non-fatal; first scan cycle can take 90s) ────
              echo "=== Waiting for scanner to become healthy (max 2 min) ==="
              for i in $(seq 1 12); do
                sleep 10
                status=$(_svc_health scanner)
                if [ "$status" = "healthy" ]; then
                  echo "  scanner healthy after $((i*10))s"
                  break
                fi
                echo "  Attempt $i/12: health=$status"
                if [ $i -eq 12 ]; then
                  echo "WARNING: scanner not yet healthy after 2 min — check logs"
                  _dc logs --tail 30 scanner 2>/dev/null || true
                fi
              done

              # ── Wait for scheduler (non-fatal; just needs Valkey) ─────────────
              echo "=== Waiting for scheduler to become healthy (max 2 min) ==="
              for i in $(seq 1 12); do
                sleep 10
                status=$(_svc_health scheduler)
                if [ "$status" = "healthy" ]; then
                  echo "  scheduler healthy after $((i*10))s"
                  break
                fi
                echo "  Attempt $i/12: health=$status"
                if [ $i -eq 12 ]; then
                  echo "WARNING: scheduler not yet healthy after 2 min"
                  _dc logs --tail 30 scheduler 2>/dev/null || true
                fi
              done

              # ── HTTP health endpoint ───────────────────────────────────────────
              echo "=== HTTP health check ==="
              for i in 1 2 3; do
                if curl -sf --max-time 10 http://localhost:8000/api/health \
                     | python3 -c "import sys,json; d=json.load(sys.stdin); \
                       print('status:', d.get('status','?'), '| tickers:', d.get('tickers','?'))"; then
                  break
                fi
                echo "  Health check attempt $i/3 failed, retrying..."
                sleep 5
              done

              # ── Services summary from /api/services ───────────────────────────
              echo "=== Service health summary ==="
              curl -sf --max-time 10 http://localhost:8000/api/services 2>/dev/null \
                | python3 -c "
import sys, json
d = json.load(sys.stdin)
for s, i in d.get('containers', {}).items():
    state = 'UP' if i.get('up') else ('STALE' if i.get('up') is False else 'UNKNOWN')
    age = (' (' + str(round(i['last_seen_ago_s'])) + 's)') if i.get('last_seen_ago_s') else ''
    print('  ' + s + ': ' + state + age)
pa = (d.get('market_data') or {}).get('price_age_s')
if pa: print('  md:prices  : ' + str(round(pa)) + 's ago')
" 2>/dev/null || echo "  (api/services not reachable)"

              echo "=== Service status (Docker) ==="
              _dc ps

              echo "=== Deployed via Docker Compose successfully ==="

            else
              # ── Systemd fallback ─────────────────────────────────────────────
              # Used when Docker is not yet installed on the EC2 instance.
              echo "=== Docker not available — falling back to systemd deploy ==="
              VENV="$APP_DIR/venv"
              SERVICE="nasdaq-agent"

              echo "=== Installing any new dependencies ==="
              sudo -u "$APP_USER" "$VENV/bin/pip" install -q -r "$APP_DIR/nasdaq_agent/requirements.txt"

              echo "=== Ensure service file has required directives ==="
              SERVICE_FILE="/etc/systemd/system/${SERVICE}.service"
              PATCHED=0
              if ! grep -q "ExecStartPre" "$SERVICE_FILE"; then
                sudo sed -i '/^ExecStart=/i ExecStartPre=/bin/truncate -s 0 /opt/nasdaq-agent/logs/agent.err' "$SERVICE_FILE"
                echo "Patched service file with ExecStartPre"
                PATCHED=1
              fi
              if ! grep -q "ExecReload" "$SERVICE_FILE"; then
                sudo sed -i '/^ExecReload=/d; /^ExecStart=/a ExecReload=/bin/kill -s HUP $MAINPID' "$SERVICE_FILE"
                echo "Patched service file with ExecReload"
                PATCHED=1
              fi
              if [ "$PATCHED" = "1" ]; then
                sudo systemctl daemon-reload
              fi

              echo "=== Reloading service (zero-downtime) ==="
              if sudo systemctl reload "$SERVICE" 2>/dev/null; then
                echo "Graceful reload sent"
              else
                echo "Reload not supported, falling back to restart"
                sudo systemctl restart "$SERVICE"
              fi

              echo "=== Waiting for service to come up ==="
              for i in $(seq 1 12); do
                sleep 5
                status=$(systemctl is-active "$SERVICE" 2>/dev/null || echo "unknown")
                if [ "$status" = "active" ]; then
                  echo "Service is active after $((i*5))s"
                  break
                fi
                echo "  Attempt $i/12: status=$status"
                if [ $i -eq 12 ]; then
                  echo "ERROR: Service failed to start within 60s"
                  sudo journalctl -u "$SERVICE" --no-pager -n 50
                  exit 1
                fi
              done

              echo "=== Health check (internal) ==="
              for i in 1 2 3; do
                if curl -sf --max-time 10 http://localhost:8000/api/health \
                     | python3 -c "import sys,json; d=json.load(sys.stdin); \
                       print('Health:', d.get('status','?'), '| Tickers:', d.get('tickers','?'))"; then
                  break
                fi
                echo "Health check attempt $i failed, retrying..."
                sleep 5
              done

              echo "=== Deployed via systemd successfully ==="
            fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment FAILED — check GitHub Actions logs"
          echo ""
          echo "Common causes of 'i/o timeout' on port 22:"
          echo "  1. AWS EC2 security group: ensure port 22 is open for GitHub Actions IPs"
          echo "     Reference: https://api.github.com/meta (look for 'actions' IP ranges)"
          echo "  2. DEPLOY_HOST secret contains wrong IP address"
          echo "  3. Instance is stopped/rebooted and has a new IP"
