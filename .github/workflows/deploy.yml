name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - claude/nasdaq-stock-prediction-agent-kDe60
    paths:
      - 'nasdaq_agent/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: SSH deploy & restart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:          ${{ secrets.DEPLOY_HOST }}
          username:      ${{ secrets.DEPLOY_USER }}
          key:           ${{ secrets.DEPLOY_SSH_KEY }}
          port:          22
          script: |
            set -e
            APP_DIR="/opt/nasdaq-agent"
            VENV="$APP_DIR/venv"
            SERVICE="nasdaq-agent"
            APP_USER="nasdaq"

            echo "=== Pulling latest code ==="
            sudo -u "$APP_USER" git -C "$APP_DIR" fetch origin
            sudo -u "$APP_USER" git -C "$APP_DIR" reset --hard origin/claude/nasdaq-stock-prediction-agent-kDe60

            echo "=== Installing any new dependencies ==="
            sudo -u "$APP_USER" "$VENV/bin/pip" install -q -r "$APP_DIR/nasdaq_agent/requirements.txt"

            echo "=== Ensure agent.err is cleared on each restart ==="
            SERVICE_FILE="/etc/systemd/system/${SERVICE}.service"
            if ! grep -q "ExecStartPre" "$SERVICE_FILE"; then
              sudo sed -i '/^ExecStart=/i ExecStartPre=/bin/truncate -s 0 /opt/nasdaq-agent/logs/agent.err' "$SERVICE_FILE"
              sudo systemctl daemon-reload
              echo "Patched service file with ExecStartPre"
            fi

            echo "=== Restarting service ==="
            sudo systemctl restart "$SERVICE"
            sleep 5

            echo "=== Health check ==="
            status=$(systemctl is-active "$SERVICE")
            if [ "$status" != "active" ]; then
              echo "ERROR: Service failed to start"
              sudo journalctl -u "$SERVICE" --no-pager -n 30
              exit 1
            fi

            echo "=== Deployed successfully ==="
            curl -sf http://localhost:8000/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('Health:', d.get('status','?'), '| Tickers:', d.get('tickers','?'))" || true

      - name: Notify on failure
        if: failure()
        run: echo "Deployment FAILED — check GitHub Actions logs"
