[pytest]
asyncio_mode = auto

# ── Default run: fast tests only, strict 8-second per-test timeout ────────────
# CI target: < 60 seconds total.
# Run the full suite locally with: pytest -m "slow or not slow"
addopts =
    -x
    --timeout=8
    -m "not slow"
    --tb=short
    -q

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    slow: tests that import heavy deps (scanner, ML, torch, xgboost) or need live Schwab/DB
    integration: tests that require a running PostgreSQL / Valkey instance

# ── Timeout plugin (pytest-timeout) ──────────────────────────────────────────
timeout = 8
timeout_method = thread
