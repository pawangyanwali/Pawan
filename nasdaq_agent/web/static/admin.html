<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASDAQ Agent — Admin</title>
  <!-- Auth guard -->
  <script>
    (function () {
      var at = sessionStorage.getItem('access_token');
      var rt = localStorage.getItem('refresh_token');
      if (!at && !rt) { window.location.replace('/login'); return; }
      if (!at && rt) {
        document.documentElement.style.visibility = 'hidden';
        fetch('/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: rt }),
        })
          .then(function (res) { if (!res.ok) throw new Error(); return res.json(); })
          .then(function (d) { sessionStorage.setItem('access_token', d.access_token); document.documentElement.style.visibility = ''; })
          .catch(function () { localStorage.removeItem('refresh_token'); window.location.replace('/login'); });
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --accent:  #58a6ff;
      --danger:  #f85149;
      --success: #3fb950;
      --warning: #d29922;
      --text:    #c9d1d9;
      --muted:   #8b949e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9rem;
    }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h1 { font-size: 1rem; font-weight: 600; }
    .topbar h1 span { color: var(--accent); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .badge {
      background: var(--accent);
      color: #0d1117;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* ── Stats strip ────────────────────────────────────────────────── */
    .stats-strip {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      flex: 1;
      min-width: 130px;
    }

    .stat-card .label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem; }
    .stat-card .value { font-size: 1.5rem; font-weight: 600; }

    /* ── Section ────────────────────────────────────────────────────── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .section-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-header h2 { font-size: 0.9rem; font-weight: 600; }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-bar select, .filter-bar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      outline: none;
    }

    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Table ──────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.65rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(88, 166, 255, 0.04); }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pill-active   { background: rgba(63,185,80,0.15);  color: var(--success); }
    .pill-pending  { background: rgba(210,153,34,0.15); color: var(--warning); }
    .pill-suspended{ background: rgba(248,81,73,0.15);  color: var(--danger);  }

    .pill-admin   { background: rgba(88,166,255,0.15); color: var(--accent);  }
    .pill-trader  { background: rgba(63,185,80,0.15);  color: var(--success); }
    .pill-analyst { background: rgba(210,153,34,0.15); color: var(--warning); }
    .pill-viewer  { background: rgba(139,148,158,0.15);color: var(--muted);   }

    /* ── Action buttons ─────────────────────────────────────────────── */
    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .btn-sm {
      border: none;
      border-radius: 4px;
      padding: 0.25rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-approve  { background: rgba(63,185,80,0.15);  color: var(--success); }
    .btn-suspend  { background: rgba(248,81,73,0.15);  color: var(--danger);  }
    .btn-activate { background: rgba(88,166,255,0.15); color: var(--accent);  }
    .btn-role     { background: rgba(210,153,34,0.15); color: var(--warning); }
    .btn-delete   { background: rgba(248,81,73,0.08);  color: var(--danger);  border: 1px solid rgba(248,81,73,0.3); }

    /* ── Toast ──────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      max-width: 320px;
      display: none;
      z-index: 999;
    }
    #toast.ok   { border-color: var(--success); color: var(--success); }
    #toast.fail { border-color: var(--danger);  color: var(--danger);  }

    /* ── Modal ──────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      width: 340px;
    }
    .modal h3 { font-size: 0.95rem; margin-bottom: 1rem; }
    .modal label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
    .modal select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem;
      margin-bottom: 1rem;
    }
    .modal-btns { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
    .btn-confirm { background: var(--accent); color: #0d1117; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }

    .empty { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>NASDAQ <span>Agent</span> &mdash; Admin Dashboard</h1>
  <div class="topbar-right">
    <span id="adminBadge" class="badge">admin</span>
    <span id="adminUsername" style="color:var(--muted);font-size:0.82rem;"></span>
    <button class="btn-logout" onclick="logout()">Sign out</button>
    <a href="/" style="color:var(--accent);font-size:0.82rem;text-decoration:none;">← Dashboard</a>
  </div>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-strip" id="statsStrip">
    <div class="stat-card"><div class="label">Total Users</div><div class="value" id="statTotal">—</div></div>
    <div class="stat-card"><div class="label">Pending Approval</div><div class="value" id="statPending" style="color:var(--warning)">—</div></div>
    <div class="stat-card"><div class="label">Active</div><div class="value" id="statActive" style="color:var(--success)">—</div></div>
    <div class="stat-card"><div class="label">Suspended</div><div class="value" id="statSuspended" style="color:var(--danger)">—</div></div>
  </div>

  <!-- Users Table -->
  <div class="section">
    <div class="section-header">
      <h2>Users</h2>
      <div class="filter-bar">
        <select id="filterStatus" onchange="loadUsers()">
          <option value="">All statuses</option>
          <option value="PENDING">Pending</option>
          <option value="ACTIVE">Active</option>
          <option value="SUSPENDED">Suspended</option>
        </select>
        <select id="filterRole" onchange="loadUsers()">
          <option value="">All roles</option>
          <option value="ADMIN">Admin</option>
          <option value="TRADER">Trader</option>
          <option value="ANALYST">Analyst</option>
          <option value="VIEWER">Viewer</option>
        </select>
        <button class="btn-refresh" onclick="loadUsers()">↺ Refresh</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Username</th><th>Email</th><th>Role</th>
            <th>Status</th><th>MFA</th><th>Created</th><th>Last Login</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTbody">
          <tr><td colspan="9" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Audit Log -->
  <div class="section">
    <div class="section-header">
      <h2>Audit Log</h2>
      <button class="btn-refresh" onclick="loadAudit()">↺ Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th><th>IP</th></tr>
        </thead>
        <tbody id="auditTbody">
          <tr><td colspan="5" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Role modal -->
<div class="modal-overlay" id="roleModal">
  <div class="modal">
    <h3>Change Role</h3>
    <label>Select new role</label>
    <select id="roleSelect">
      <option value="ADMIN">Admin</option>
      <option value="TRADER">Trader</option>
      <option value="ANALYST">Analyst</option>
      <option value="VIEWER">Viewer</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmRole()">Apply</button>
    </div>
  </div>
</div>

<!-- Approve modal -->
<div class="modal-overlay" id="approveModal">
  <div class="modal">
    <h3>Approve User</h3>
    <label>Assign role</label>
    <select id="approveRole">
      <option value="VIEWER">Viewer</option>
      <option value="ANALYST">Analyst</option>
      <option value="TRADER">Trader</option>
      <option value="ADMIN">Admin</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmApprove()">Approve</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = '';
  let _pendingUserId = null;

  function getToken() { return sessionStorage.getItem('access_token'); }

  async function authFetch(url, opts = {}) {
    const token = getToken();
    if (!token) { window.location.href = '/login'; return null; }
    opts.headers = {...(opts.headers || {}), 'Authorization': `Bearer ${token}`};
    const res = await fetch(API + url, opts);
    if (res.status === 401) { window.location.href = '/login'; return null; }
    return res;
  }

  function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = ok ? 'ok' : 'fail';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function rolePill(role) {
    const cls = {'ADMIN':'admin','TRADER':'trader','ANALYST':'analyst','VIEWER':'viewer'}[role] || 'viewer';
    return `<span class="pill pill-${cls}">${role}</span>`;
  }

  function statusPill(s) {
    const cls = {'ACTIVE':'active','PENDING':'pending','SUSPENDED':'suspended'}[s] || 'pending';
    return `<span class="pill pill-${cls}">${s}</span>`;
  }

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString(undefined, {dateStyle:'short', timeStyle:'short'});
  }

  // ── Stats ────────────────────────────────────────────────────────────────
  async function loadStats() {
    const res = await authFetch('/admin/stats');
    if (!res || !res.ok) return;
    const d = await res.json();
    document.getElementById('statTotal').textContent    = d.total     ?? '—';
    document.getElementById('statPending').textContent  = d.pending   ?? '—';
    document.getElementById('statActive').textContent   = (d.by_status || {}).ACTIVE    ?? 0;
    document.getElementById('statSuspended').textContent=(d.by_status || {}).SUSPENDED  ?? 0;
  }

  // ── Users ────────────────────────────────────────────────────────────────
  async function loadUsers() {
    const status = document.getElementById('filterStatus').value;
    const role   = document.getElementById('filterRole').value;
    let url = '/admin/users';
    const p = [];
    if (status) p.push(`status=${status}`);
    if (role)   p.push(`role=${role}`);
    if (p.length) url += '?' + p.join('&');

    const res = await authFetch(url);
    if (!res || !res.ok) return;
    const users = await res.json();
    const tbody = document.getElementById('usersTbody');

    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty">No users found</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td><strong>${u.username}</strong></td>
        <td style="color:var(--muted)">${u.email}</td>
        <td>${rolePill(u.role)}</td>
        <td>${statusPill(u.status)}</td>
        <td>${u.mfa_enabled ? '<span style="color:var(--success)">✓</span>' : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="color:var(--muted);font-size:0.78rem">${fmtDate(u.created_at)}</td>
        <td style="color:var(--muted);font-size:0.78rem">${fmtDate(u.last_login)}</td>
        <td>
          <div class="actions">
            ${u.status === 'PENDING'    ? `<button class="btn-sm btn-approve"  onclick="openApprove(${u.id})">Approve</button>` : ''}
            ${u.status === 'ACTIVE'     ? `<button class="btn-sm btn-suspend"  onclick="suspend(${u.id})">Suspend</button>` : ''}
            ${u.status === 'SUSPENDED'  ? `<button class="btn-sm btn-activate" onclick="activate(${u.id})">Activate</button>` : ''}
            <button class="btn-sm btn-role" onclick="openRole(${u.id})">Role</button>
            <button class="btn-sm btn-delete" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  // ── Approve modal ────────────────────────────────────────────────────────
  function openApprove(id) {
    _pendingUserId = id;
    document.getElementById('approveModal').classList.add('open');
  }

  async function confirmApprove() {
    const role = document.getElementById('approveRole').value;
    const res = await authFetch(`/admin/users/${_pendingUserId}/approve`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({role}),
    });
    closeModal();
    if (res && res.ok) { toast('User approved'); loadUsers(); loadStats(); }
    else { toast('Approval failed', false); }
  }

  // ── Role modal ───────────────────────────────────────────────────────────
  function openRole(id) {
    _pendingUserId = id;
    document.getElementById('roleModal').classList.add('open');
  }

  async function confirmRole() {
    const role = document.getElementById('roleSelect').value;
    const res = await authFetch(`/admin/users/${_pendingUserId}/role`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({role}),
    });
    closeModal();
    if (res && res.ok) { toast('Role updated'); loadUsers(); }
    else { toast('Role update failed', false); }
  }

  function closeModal() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
    _pendingUserId = null;
  }

  // ── Suspend / Activate / Delete ──────────────────────────────────────────
  async function suspend(id) {
    if (!confirm('Suspend this user?')) return;
    const res = await authFetch(`/admin/users/${id}/suspend`, {method: 'PATCH'});
    if (res && res.ok) { toast('User suspended'); loadUsers(); loadStats(); }
    else { toast('Failed', false); }
  }

  async function activate(id) {
    const res = await authFetch(`/admin/users/${id}/activate`, {method: 'PATCH'});
    if (res && res.ok) { toast('User activated'); loadUsers(); loadStats(); }
    else { toast('Failed', false); }
  }

  async function deleteUser(id, username) {
    if (!confirm(`Permanently delete user "${username}"? This cannot be undone.`)) return;
    const res = await authFetch(`/admin/users/${id}`, {method: 'DELETE'});
    if (res && res.ok) { toast('User deleted'); loadUsers(); loadStats(); }
    else { toast('Delete failed', false); }
  }

  // ── Audit log ────────────────────────────────────────────────────────────
  async function loadAudit() {
    const res = await authFetch('/admin/audit-log?limit=50');
    if (!res || !res.ok) return;
    const rows = await res.json();
    const tbody = document.getElementById('auditTbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No events yet</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td style="color:var(--muted);font-size:0.78rem;white-space:nowrap">${fmtDate(r.ts)}</td>
        <td>${r.username || `#${r.user_id}` || '—'}</td>
        <td><code style="color:var(--accent);font-size:0.78rem">${r.action}</code></td>
        <td style="color:var(--muted);font-size:0.78rem;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.detail ? JSON.stringify(r.detail) : '—'}</td>
        <td style="color:var(--muted);font-size:0.78rem">${r.ip_addr || '—'}</td>
      </tr>
    `).join('');
  }

  // ── Logout ───────────────────────────────────────────────────────────────
  async function logout() {
    const rt = localStorage.getItem('refresh_token');
    if (rt) {
      try {
        await authFetch('/auth/logout', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({refresh_token: rt}),
        });
      } catch (_) {}
    }
    sessionStorage.clear();
    localStorage.removeItem('refresh_token');
    window.location.href = '/login';
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  (async function init() {
    if (!getToken()) { window.location.href = '/login'; return; }

    // Verify admin role
    const meRes = await authFetch('/auth/me');
    if (!meRes || !meRes.ok) { window.location.href = '/login'; return; }
    const me = await meRes.json();
    if (me.role !== 'ADMIN') {
      alert('Admin access required');
      window.location.href = '/';
      return;
    }
    document.getElementById('adminUsername').textContent = me.username;

    await Promise.all([loadStats(), loadUsers(), loadAudit()]);
  })();
</script>
</body>
</html>
